<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ほくほく栗拾い＆栗割り名人</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #2b1e16;
            background-image: radial-gradient(#3d2c20 15%, transparent 16%), radial-gradient(#3d2c20 15%, transparent 16%);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
        }
        canvas {
            touch-action: none;
            cursor: pointer;
        }
        .wood-border {
            border: 6px solid #5a3825;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.6), 0 10px 20px rgba(0, 0, 0, 0.5);
        }
        .splash-text {
            text-shadow: 3px 3px 0 #2a1508, -1px -1px 0 #2a1508, 1px -1px 0 #2a1508, -1px 1px 0 #2a1508, 1px 1px 0 #2a1508;
        }
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-bounce-short {
            animation: bounce-short 1.2s infinite;
        }
    </style>
</head>
<body class="min-h-screen text-amber-50 flex flex-col items-center justify-between p-2 sm:p-4 overflow-x-hidden">

    <!-- ヘッダー・スコアボード -->
    <header class="w-full max-w-md bg-amber-950/85 backdrop-blur border-2 border-amber-700/80 rounded-2xl p-3 mb-2 shadow-xl flex justify-between items-center text-amber-100">
        <div class="flex items-center gap-2">
            <div class="bg-amber-900/90 p-2 rounded-xl border border-amber-600/50">
                <i class="fa-solid fa-basket-shopping text-2xl text-amber-400"></i>
            </div>
            <div>
                <div class="text-xs text-amber-300 font-bold">拾った栗</div>
                <div class="text-xl font-black text-amber-100"><span id="harvest-count">0</span> <span class="text-xs font-normal">個</span></div>
            </div>
        </div>
        
        <div class="text-center">
            <div class="text-xs text-amber-300 font-bold">残り時間</div>
            <div id="timer" class="text-2xl font-black text-amber-400">45</div>
        </div>

        <div class="flex items-center gap-2">
            <div class="text-right">
                <div class="text-xs text-amber-300 font-bold">スコア</div>
                <div class="text-xl font-black text-yellow-400"><span id="score">0</span> <span class="text-xs font-normal">pt</span></div>
            </div>
            <div class="bg-amber-900/90 p-2 rounded-xl border border-amber-600/50">
                <i class="fa-solid fa-trophy text-2xl text-yellow-400"></i>
            </div>
        </div>
    </header>

    <!-- メインゲームエリア -->
    <main class="relative w-full max-w-md flex-1 flex flex-col justify-center items-center">

        <!-- ゲームキャンバスコンテナ -->
        <div class="relative w-full aspect-[4/5] bg-gradient-to-b from-amber-950 via-stone-900 to-amber-950 rounded-3xl overflow-hidden wood-border shadow-2xl">
            <!-- ゲームメイン描画キャンバス -->
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- 操作ヒント -->
            <div id="hint-overlay" class="absolute bottom-4 left-0 right-0 text-center pointer-events-none transition-opacity duration-300">
                <span class="bg-black/70 text-amber-200 px-4 py-2 rounded-full text-xs sm:text-sm font-bold animate-bounce-short border border-amber-500/40">
                    <i class="fa-solid fa-hand-pointer mr-1"></i> イガ栗をタップ連打で割ろう！
                </span>
            </div>

            <!-- エフェクト表示用レイヤー -->
            <div id="effect-layer" class="absolute inset-0 pointer-events-none"></div>

            <!-- モーダル（スタート / リザルト） -->
            <div id="modal-overlay" class="absolute inset-0 bg-black/80 backdrop-blur-sm flex flex-col justify-center items-center p-6 text-center z-20">
                
                <!-- スタート画面 -->
                <div id="start-screen" class="space-y-5">
                    <div>
                        <h1 class="text-3xl sm:text-4xl font-black text-amber-400 splash-text tracking-wider">ほくほく！<br>栗拾い＆栗割り名人</h1>
                        <p class="text-amber-200 text-xs sm:text-sm mt-2 font-bold">木から落ちてくる栗を連打で割って収穫しよう！</p>
                    </div>

                    <div class="bg-amber-950/70 p-4 rounded-2xl border border-amber-700/60 text-left text-xs text-amber-100 space-y-2 max-w-xs mx-auto">
                        <p class="font-bold text-amber-300 text-sm mb-1"><i class="fa-solid fa-circle-info mr-1"></i> 遊び方</p>
                        <p>🌰 <b>いが栗：</b> タップで割ると栗が飛び出る！</p>
                        <p>✨ <b>金のいが栗：</b> 連打で割ると高得点栗が大量！</p>
                        <p>🍂 <b>割れた栗/実：</b> 1タップでそのままゲット！</p>
                        <p class="text-amber-400 font-bold">💣 毛虫（イモムシ）： 触るとタイムロス！</p>
                    </div>

                    <button id="start-btn" class="w-full max-w-xs py-4 bg-gradient-to-r from-amber-500 to-amber-700 hover:from-amber-400 hover:to-amber-600 text-amber-950 font-black text-xl rounded-2xl shadow-xl transform active:scale-95 transition border-2 border-amber-300">
                        栗拾いスタート <i class="fa-solid fa-play ml-1"></i>
                    </button>
                </div>

                <!-- リザルト画面 -->
                <div id="result-screen" class="space-y-5 hidden w-full max-w-xs">
                    <h2 class="text-3xl font-black text-amber-400 splash-text">収穫終了！</h2>
                    
                    <div class="bg-amber-950/90 p-5 rounded-2xl border-2 border-amber-600 space-y-3">
                        <div>
                            <div class="text-xs text-amber-300 font-bold">最終獲得スコア</div>
                            <div class="text-4xl font-black text-yellow-400"><span id="final-score">0</span> <span class="text-base font-normal text-amber-200">pt</span></div>
                        </div>
                        <div class="h-px bg-amber-800"></div>
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-amber-300">拾った栗の合計:</span>
                            <span class="font-bold text-amber-100 text-lg"><span id="final-count">0</span> 個</span>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-amber-300">獲得称号:</span>
                            <span id="title-badge" class="font-bold text-yellow-300 bg-amber-900 px-2 py-1 rounded border border-yellow-500/40">栗拾い初心者</span>
                        </div>
                    </div>

                    <button id="restart-btn" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-emerald-700 hover:from-emerald-400 hover:to-emerald-600 text-emerald-950 font-black text-xl rounded-2xl shadow-xl transform active:scale-95 transition border-2 border-emerald-300">
                        もう一度遊ぶ <i class="fa-solid fa-rotate-right ml-1"></i>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- フッター -->
    <footer class="w-full max-w-md mt-2 flex justify-between items-center text-xs text-amber-400/80 px-2">
        <span><i class="fa-solid fa-tree text-emerald-600"></i> 秋の栗園エリア</span>
        <button id="sound-toggle" class="hover:text-amber-200 transition">
            <i class="fa-solid fa-volume-high text-base"></i> BGM/SE: ON
        </button>
    </footer>

    <!-- JavaScript ゲームロジック -->
    <script>
        // Web Audio API によるサウンドシステム
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTap() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300 + Math.random() * 100, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.05);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.05);
                } catch(e){}
            }

            playCrack() {
                if (this.muted || !this.ctx) return;
                try {
                    // 殻が破れるぱきっとした音
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.1);

                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } catch(e){}
            }

            playGet() {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5

                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } catch(e){}
            }

            playGold() {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0, now + idx * 0.05);
                        gain.gain.linearRampToValueAtTime(0.25, now + idx * 0.05 + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.25);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.05);
                        osc.stop(now + idx * 0.05 + 0.25);
                    });
                } catch(e){}
            }

            playBad() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.2);

                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.2);
                } catch(e){}
            }
        }

        const audio = new SoundSystem();

        // ゲーム状態の管理
        const state = {
            isPlaying: false,
            score: 0,
            harvestCount: 0,
            timeLeft: 45,
            timerId: null,
            canvas: null,
            ctx: null,
            items: [],          // ゲーム内オブジェクト（イガ栗、むき栗、虫）
            particles: [],      // 砕けたイガの破片
            spawnTimer: 0,
            lastTime: 0
        };

        const elements = {
            canvas: document.getElementById('gameCanvas'),
            score: document.getElementById('score'),
            count: document.getElementById('harvest-count'),
            timer: document.getElementById('timer'),
            overlay: document.getElementById('modal-overlay'),
            startScreen: document.getElementById('start-screen'),
            resultScreen: document.getElementById('result-screen'),
            startBtn: document.getElementById('start-btn'),
            restartBtn: document.getElementById('restart-btn'),
            finalScore: document.getElementById('final-score'),
            finalCount: document.getElementById('final-count'),
            titleBadge: document.getElementById('title-badge'),
            effectLayer: document.getElementById('effect-layer'),
            hintOverlay: document.getElementById('hint-overlay'),
            soundToggle: document.getElementById('sound-toggle')
        };

        // 初期化
        function init() {
            state.canvas = elements.canvas;
            state.ctx = state.canvas.getContext('2d');

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            setupEvents();
            requestAnimationFrame(gameLoop);
        }

        function resizeCanvas() {
            const rect = state.canvas.parentElement.getBoundingClientRect();
            state.canvas.width = rect.width;
            state.canvas.height = rect.height;
        }

        function setupEvents() {
            const c = state.canvas;

            const handleTap = (e) => {
                if (!state.isPlaying) return;
                audio.init();

                const rect = c.getBoundingClientRect();
                const x = ((e.clientX || (e.touches && e.touches[0].clientX)) - rect.left) * (c.width / rect.width);
                const y = ((e.clientY || (e.touches && e.touches[0].clientY)) - rect.top) * (c.height / rect.height);

                checkHit(x, y);
                elements.hintOverlay.style.opacity = '0';
            };

            c.addEventListener('mousedown', handleTap);
            c.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleTap(e);
            });

            elements.startBtn.addEventListener('click', startGame);
            elements.restartBtn.addEventListener('click', startGame);

            elements.soundToggle.addEventListener('click', () => {
                audio.muted = !audio.muted;
                elements.soundToggle.innerHTML = audio.muted ?
                    '<i class="fa-solid fa-volume-xmark text-base"></i> BGM/SE: OFF' :
                    '<i class="fa-solid fa-volume-high text-base"></i> BGM/SE: ON';
            });
        }

        // ゲームオブジェクト作成（イガ栗、栗の実、毛虫など）
        function spawnItem() {
            const w = state.canvas.width;
            const rand = Math.random();

            let type = 'burr'; // 通常のいが栗
            if (rand < 0.12) type = 'gold_burr'; // 黄金のいが栗
            else if (rand < 0.25) type = 'nut';  // 直の栗の実
            else if (rand < 0.35) type = 'bug';  // 毛虫

            const size = type === 'gold_burr' ? 44 : 36;
            const item = {
                id: Math.random(),
                type: type,
                x: Math.random() * (w - 80) + 40,
                y: -50,
                vx: (Math.random() - 0.5) * 1.5,
                vy: 1.2 + Math.random() * 1.8,
                radius: size,
                hp: type === 'gold_burr' ? 4 : (type === 'burr' ? 2 : 1), // 破るためのタップ回数
                maxHp: type === 'gold_burr' ? 4 : (type === 'burr' ? 2 : 1),
                rotation: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.05
            };

            state.items.push(item);
        }

        // タップ判定
        function checkHit(x, y) {
            // 上にある（リストの後ろの）オブジェクト優先で判定
            for (let i = state.items.length - 1; i >= 0; i--) {
                const item = state.items[i];
                const dist = Math.hypot(x - item.x, y - item.y);

                if (dist < item.radius + 12) {
                    // 毛虫に触れた場合
                    if (item.type === 'bug') {
                        audio.playBad();
                        showFloatingText(item.x, item.y, "痛っ！ -3秒", "text-red-400");
                        createParticles(item.x, item.y, '#718096', 8);
                        state.timeLeft = Math.max(0, state.timeLeft - 3);
                        elements.timer.innerText = state.timeLeft;
                        state.items.splice(i, 1);
                        return;
                    }

                    // そのまま拾える栗の実
                    if (item.type === 'nut' || item.type === 'gold_nut') {
                        const isGold = item.type === 'gold_nut';
                        const pts = isGold ? 300 : 100;
                        if (isGold) audio.playGold(); else audio.playGet();

                        state.score += pts;
                        state.harvestCount++;
                        elements.score.innerText = state.score;
                        elements.count.innerText = state.harvestCount;

                        showFloatingText(item.x, item.y, `+${pts}pt!`, isGold ? "text-yellow-300" : "text-amber-200");
                        createParticles(item.x, item.y, isGold ? '#f6e05e' : '#d69e2e', 10);
                        state.items.splice(i, 1);
                        return;
                    }

                    // イガ栗を割る処理
                    if (item.type === 'burr' || item.type === 'gold_burr') {
                        item.hp--;
                        item.radius *= 0.95; // 衝撃で若干キュッと小さく

                        if (item.hp > 0) {
                            audio.playTap();
                            createParticles(item.x, item.y, item.type === 'gold_burr' ? '#ecc94b' : '#38a169', 5);
                        } else {
                            // 殻割れ達成！
                            audio.playCrack();
                            const isGold = item.type === 'gold_burr';
                            createParticles(item.x, item.y, isGold ? '#d69e2e' : '#2f855a', 15);

                            // 割れた中から栗の実を飛び出させる
                            const nutCount = isGold ? 3 : 1;
                            for (let n = 0; n < nutCount; n++) {
                                state.items.push({
                                    id: Math.random(),
                                    type: isGold ? 'gold_nut' : 'nut',
                                    x: item.x + (n - (nutCount - 1) / 2) * 20,
                                    y: item.y,
                                    vx: (Math.random() - 0.5) * 3,
                                    vy: -2 - Math.random() * 2, // 跳ね上がる
                                    radius: isGold ? 26 : 22,
                                    hp: 1,
                                    maxHp: 1,
                                    rotation: 0,
                                    vRot: (Math.random() - 0.5) * 0.1
                                });
                            }

                            state.items.splice(i, 1);
                        }
                        return;
                    }
                }
            }
        }

        // 破片パーティクルの生成
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 4;
                state.particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 2 + Math.random() * 4,
                    color: color,
                    alpha: 1,
                    life: 0.03 + Math.random() * 0.03
                });
            }
        }

        // メインゲームループ
        function gameLoop(timestamp) {
            if (!state.lastTime) state.lastTime = timestamp;
            const dt = (timestamp - state.lastTime) / 1000;
            state.lastTime = timestamp;

            if (state.isPlaying) {
                updateGame(dt);
            }

            renderGame();
            requestAnimationFrame(gameLoop);
        }

        // オブジェクトの更新
        function updateGame(dt) {
            const h = state.canvas.height;

            // スポーン処理
            state.spawnTimer += dt;
            if (state.spawnTimer > 0.65) {
                spawnItem();
                state.spawnTimer = 0;
            }

            // アイテムの位置移動
            for (let i = state.items.length - 1; i >= 0; i--) {
                const item = state.items[i];
                item.x += item.vx;
                item.y += item.vy;
                item.rotation += item.vRot;

                // むき栗は少し重力の影響で落下
                if (item.type === 'nut' || item.type === 'gold_nut') {
                    item.vy += 0.1;
                }

                // 画面外（下）に落ちたら削除
                if (item.y > h + 60) {
                    state.items.splice(i, 1);
                }
            }

            // パーティクルの更新
            for (let i = state.particles.length - 1; i >= 0; i--) {
                const p = state.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.life;

                if (p.alpha <= 0) {
                    state.particles.splice(i, 1);
                }
            }
        }

        // キャンバス描画
        function renderGame() {
            const ctx = state.ctx;
            const w = state.canvas.width;
            const h = state.canvas.height;

            ctx.clearRect(0, 0, w, h);

            // 背景：落ち葉散る秋の木立の雰囲気
            drawBackground(ctx, w, h);

            // ゲームアイテム描画
            state.items.forEach(item => {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.rotate(item.rotation);

                if (item.type === 'burr') {
                    drawBurr(ctx, item.radius, '#2e7d32', '#1b5e20', item.hp, item.maxHp);
                } else if (item.type === 'gold_burr') {
                    drawBurr(ctx, item.radius, '#fbc02d', '#f57f17', item.hp, item.maxHp);
                } else if (item.type === 'nut') {
                    drawChestnutNut(ctx, item.radius, '#6d4c41', '#d7ccc8');
                } else if (item.type === 'gold_nut') {
                    drawChestnutNut(ctx, item.radius, '#ffd700', '#fff8e1');
                } else if (item.type === 'bug') {
                    drawCaterpillar(ctx, item.radius);
                }

                ctx.restore();
            });

            // パーティクル描画
            state.particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // 背景の描画
        function drawBackground(ctx, w, h) {
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#21130d');
            grad.addColorStop(0.5, '#3a2312');
            grad.addColorStop(1, '#1c1009');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // 木漏れ日風デザイン
            ctx.fillStyle = 'rgba(255, 235, 150, 0.03)';
            ctx.beginPath();
            ctx.arc(w * 0.2, h * 0.2, 120, 0, Math.PI * 2);
            ctx.arc(w * 0.8, h * 0.3, 160, 0, Math.PI * 2);
            ctx.fill();
        }

        // イガ栗の描画（トゲトゲ）
        function drawBurr(ctx, radius, mainColor, darkColor, hp, maxHp) {
            ctx.fillStyle = mainColor;
            ctx.strokeStyle = darkColor;
            ctx.lineWidth = 2;

            // イガのトゲトゲ描画
            const spikes = 16;
            ctx.beginPath();
            for (let i = 0; i < spikes; i++) {
                const angle = (Math.PI * 2 / spikes) * i;
                const outerR = radius + (i % 2 === 0 ? 8 : 2);
                const innerR = radius * 0.6;

                const x1 = Math.cos(angle) * outerR;
                const y1 = Math.sin(angle) * outerR;
                const x2 = Math.cos(angle + Math.PI / spikes) * innerR;
                const y2 = Math.sin(angle + Math.PI / spikes) * innerR;

                if (i === 0) ctx.moveTo(x1, y1);
                else ctx.lineTo(x1, y1);
                ctx.lineTo(x2, y2);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // ダメージによる亀裂の線の表現
            if (hp < maxHp) {
                ctx.strokeStyle = '#3e2723';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-radius * 0.3, -radius * 0.3);
                ctx.lineTo(radius * 0.2, radius * 0.2);
                ctx.stroke();
            }
        }

        // 栗の実の描画（つややかな茶色と底のおしり）
        function drawChestnutNut(ctx, radius, topColor, bottomColor) {
            ctx.save();

            // 栗のシルエット（上がツンと尖った形）
            ctx.beginPath();
            ctx.moveTo(0, -radius * 1.1);
            ctx.bezierCurveTo(radius * 1.1, -radius * 0.4, radius * 1.1, radius * 0.8, 0, radius * 0.9);
            ctx.bezierCurveTo(-radius * 1.1, radius * 0.8, -radius * 1.1, -radius * 0.4, 0, -radius * 1.1);
            ctx.closePath();

            // メイン色
            ctx.fillStyle = topColor;
            ctx.fill();

            ctx.strokeStyle = '#3e2723';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 底（座）の部分
            ctx.beginPath();
            ctx.ellipse(0, radius * 0.55, radius * 0.75, radius * 0.3, 0, 0, Math.PI);
            ctx.fillStyle = bottomColor;
            ctx.fill();
            ctx.stroke();

            // ハイライト（ツヤ）
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.ellipse(-radius * 0.3, -radius * 0.3, radius * 0.25, radius * 0.12, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // 毛虫（障害物）の描画
        function drawCaterpillar(ctx, radius) {
            ctx.fillStyle = '#43a047';
            // 体の節々
            for (let i = -2; i <= 2; i++) {
                ctx.beginPath();
                ctx.arc(i * 9, Math.sin(i) * 3, 9, 0, Math.PI * 2);
                ctx.fill();
            }
            // 頭と目
            ctx.fillStyle = '#e53935';
            ctx.beginPath();
            ctx.arc(18, 0, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(20, -2, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // 浮き出るテキストアニメーション
        function showFloatingText(x, y, text, colorClass) {
            const el = document.createElement('div');
            el.className = `absolute font-black text-lg sm:text-xl splash-text pointer-events-none transition-all duration-700 ease-out ${colorClass}`;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.transform = 'translate(-50%, -50%) scale(0.8)';
            el.innerText = text;

            elements.effectLayer.appendChild(el);

            setTimeout(() => {
                el.style.transform = 'translate(-50%, -120%) scale(1.2)';
                el.style.opacity = '0';
            }, 50);

            setTimeout(() => el.remove(), 750);
        }

        // ゲーム開始
        function startGame() {
            state.score = 0;
            state.harvestCount = 0;
            state.timeLeft = 45;
            state.isPlaying = true;
            state.items = [];
            state.particles = [];

            elements.score.innerText = '0';
            elements.count.innerText = '0';
            elements.timer.innerText = '45';

            elements.overlay.classList.add('hidden');
            elements.startScreen.classList.add('hidden');
            elements.resultScreen.classList.add('hidden');
            elements.hintOverlay.style.opacity = '1';

            if (state.timerId) clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                state.timeLeft--;
                elements.timer.innerText = state.timeLeft;

                if (state.timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // ゲーム終了
        function endGame() {
            state.isPlaying = false;
            clearInterval(state.timerId);

            elements.finalScore.innerText = state.score;
            elements.finalCount.innerText = state.harvestCount;

            // 称号決定
            let title = "栗拾い初心者";
            if (state.score >= 4000) title = "伝説の栗神さま";
            else if (state.score >= 2600) title = "ほくほく栗割り名人";
            else if (state.score >= 1400) title = "ベテラン栗農家";
            else if (state.score >= 600) title = "期待の栗ハンター";
            elements.titleBadge.innerText = title;

            elements.overlay.classList.remove('hidden');
            elements.resultScreen.classList.remove('hidden');
        }

        window.onload = () => {
            init();
        };
    </script>
</body>
